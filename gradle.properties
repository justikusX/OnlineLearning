org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Base URL for the Retrofit course catalog (must end with "/").
# By default the catalog is served straight from this GitHub repository (hosting/public/api/courses.json),
# so pushing to main updates the app without any deploy. After `firebase deploy --only hosting` you can switch
# to https://mobileapp-252b2.web.app/api/ instead.
# If the request fails, the app falls back to the bundled app/src/main/assets/courses.json.
COURSES_API_BASE_URL=https://raw.githubusercontent.com/justikusX/OnlineLearning/main/hosting/public/api/
